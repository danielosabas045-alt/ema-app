<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOCVAULT - Visor de Archivos</title>

    <!-- Fuentes y Estilos -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #0a0a0a;
            color: #fff;
            font-family: 'Inter', sans-serif;
            padding: 20px;
            min-height: 100vh;
        }

        .contenedor {
            max-width: 1200px;
            margin: 0 auto;
        }

        h1 {
            text-align: center;
            font-size: 42px;
            color: #FFD700;
            margin-bottom: 30px;
            text-shadow: 0 0 15px rgba(255, 215, 0, 0.4);
        }

        .caja-carga {
            border: 3px dashed #FFD700;
            border-radius: 16px;
            padding: 50px;
            text-align: center;
            cursor: pointer;
            margin-bottom: 30px;
            background-color: rgba(255, 215, 0, 0.05);
            transition: all 0.3s ease;
        }

        .caja-carga:hover {
            background-color: rgba(255, 215, 0, 0.12);
            box-shadow: 0 0 25px rgba(255, 215, 0, 0.25);
        }

        .caja-carga i {
            font-size: 60px;
            color: #FFD700;
            margin-bottom: 15px;
        }

        .caja-carga p {
            font-size: 20px;
            color: #ddd;
        }

        input[type="file"] {
            display: none;
        }

        .informacion {
            background-color: #1a1a1a;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
            border: 2px solid #333;
        }

        .informacion p {
            font-size: 17px;
            margin: 8px 0;
        }

        .informacion span {
            color: #FFD700;
            font-weight: 700;
        }

        .visor {
            background-color: #111;
            border-radius: 12px;
            padding: 25px;
            border: 2px solid #333;
            min-height: 400px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .visor canvas, .visor img {
            max-width: 100%;
            border-radius: 8px;
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.15);
        }

        .botones {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            margin-top: 20px;
        }

        button {
            padding: 14px 24px;
            font-size: 16px;
            font-weight: 700;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.25s ease;
        }

        .boton-dorado {
            background: linear-gradient(90deg, #B8860B, #FFD700);
            color: #000;
        }

        .boton-dorado:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(255, 215, 0, 0.35);
        }

        .boton-borde {
            background: transparent;
            color: #FFD700;
            border: 2px solid #FFD700;
        }

        .boton-borde:hover {
            background-color: rgba(255, 215, 0, 0.15);
        }

        .vacio {
            text-align: center;
            color: #777;
        }

        .vacio i {
            font-size: 80px;
            color: #444;
            margin-bottom: 20px;
        }

        .barra-progreso {
            width: 100%;
            height: 10px;
            background-color: #222;
            border-radius: 5px;
            margin-top: 15px;
            overflow: hidden;
        }

        .progreso {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #B8860B, #FFD700);
            transition: width 0.3s ease;
        }
    </style>
</head>
<body>

    <div class="contenedor">
        <h1><i class="fa-solid fa-vault"></i> DOCVAULT</h1>

        <!-- Cargar Archivo -->
        <label class="caja-carga" for="entradaArchivo">
            <i class="fa-solid fa-cloud-upload-alt"></i>
            <p>👉 Haz clic aquí o arrastra tu archivo</p>
            <p style="font-size: 15px; margin-top: 8px;">PDF · Imágenes (JPG, PNG, GIF, WEBP)</p>
        </label>
        <input type="file" id="entradaArchivo" accept=".pdf,.jpg,.jpeg,.png,.gif,.webp">

        <div class="barra-progreso">
            <div class="progreso" id="barraProgreso"></div>
        </div>

        <!-- Información -->
        <div class="informacion">
            <p>📄 Archivo: <span id="nombreArchivo">Sin archivo</span></p>
            <p>📦 Tipo: <span id="tipoArchivo">—</span></p>
            <p>📏 Tamaño: <span id="tamanoArchivo">—</span></p>
            <p>📖 Página: <span id="paginaActual">0 / 0</span></p>
        </div>

        <!-- Visor -->
        <div class="visor" id="areaVisor">
            <div class="vacio" id="estadoVacio">
                <i class="fa-solid fa-folder-open"></i>
                <p>Carga un archivo para verlo aquí</p>
            </div>
            <canvas id="lienzoPDF" style="display: none;"></canvas>
            <img id="imagenVista" style="display: none;" alt="Vista previa">
        </div>

        <!-- Botones -->
        <div class="botones">
            <button class="boton-borde" id="btnAnterior" style="display: none;" onclick="paginaAnterior()">
                <i class="fa-solid fa-chevron-left"></i> Anterior
            </button>
            <button class="boton-borde" id="btnSiguiente" style="display: none;" onclick="paginaSiguiente()">
                Siguiente <i class="fa-solid fa-chevron-right"></i>
            </button>
            <button class="boton-borde" onclick="acercar()">
                <i class="fa-solid fa-search-plus"></i> Acercar
            </button>
            <button class="boton-borde" onclick="alejar()">
                <i class="fa-solid fa-search-minus"></i> Alejar
            </button>
            <button class="boton-dorado" onclick="descargar()">
                <i class="fa-solid fa-download"></i> Descargar
            </button>
            <button class="boton-borde" style="color:#ff6666; border-color:#ff6666;" onclick="limpiar()">
                <i class="fa-solid fa-trash"></i> Limpiar
            </button>
        </div>
    </div>

    <!-- PDF.js desde CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.0.379/pdf.min.js"></script>

    <script>
        // Configurar PDF.js
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.0.379/pdf.worker.min.js';

        // Variables
        let documentoPDF = null;
        let pagina = 1;
        let totalPaginas = 0;
        let escala = 1.5;
        let archivoActual = null;
        let urlArchivo = null;

        // Elementos
        const entrada = document.getElementById('entradaArchivo');
        const lienzo = document.getElementById('lienzoPDF');
        const ctx = lienzo.getContext('2d');
        const imagenVista = document.getElementById('imagenVista');
        const estadoVacio = document.getElementById('estadoVacio');
        const barraProgreso = document.getElementById('barraProgreso');

        // Evento al seleccionar archivo
        entrada.addEventListener('change', function(e) {
            if (e.target.files && e.target.files[0]) {
                procesarArchivo(e.target.files[0]);
            }
        });

        // Arrastrar y soltar
        const caja = document.querySelector('.caja-carga');
        caja.addEventListener('dragover', e => { e.preventDefault(); });
        caja.addEventListener('drop', e => {
            e.preventDefault();
            if (e.dataTransfer.files && e.dataTransfer.files[0]) {
                procesarArchivo(e.dataTransfer.files[0]);
            }
        });

        // Procesar archivo
        async function procesarArchivo(archivo) {
            try {
                archivoActual = archivo;
                reiniciarVisor();
                barraProgreso.style.width = '15%';

                // Mostrar información
                document.getElementById('nombreArchivo').textContent = archivo.name;
                document.getElementById('tipoArchivo').textContent = archivo.type || 'Desconocido';
                document.getElementById('tamanoArchivo').textContent = formatoTamano(archivo.size);

                barraProgreso.style.width = '35%';

                // Si es PDF
                if (archivo.name.toLowerCase().endsWith('.pdf') || archivo.type === 'application/pdf') {
                    barraProgreso.style.width = '50%';
                    const datos = await archivo.arrayBuffer();
                    barraProgreso.style.width = '70%';

                    const carga = await pdfjsLib.getDocument({ data: datos }).promise;
                    documentoPDF = carga;
                    totalPaginas = carga.numPages;
                    pagina = 1;

                    document.getElementById('paginaActual').textContent = `${pagina} / ${totalPaginas}`;
                    barraProgreso.style.width = '85%';

                    await dibujarPagina();

                    estadoVacio.style.display = 'none';
                    lienzo.style.display = 'block';
                    imagenVista.style.display = 'none';
                    document.getElementById('btnAnterior').style.display = 'inline-block';
                    document.getElementById('btnSiguiente').style.display = 'inline-block';

                    barraProgreso.style.width = '100%';
                    setTimeout(() => barraProgreso.style.width = '0%', 1200);
                    return;
                }

                // Si es imagen
                if (archivo.type.startsWith('image/')) {
                    barraProgreso.style.width = '60%';
                    if (urlArchivo) URL.revokeObjectURL(urlArchivo);
                    urlArchivo = URL.createObjectURL(archivo);

                    imagenVista.src = urlArchivo;
                    imagenVista.onload = () => {
                        estadoVacio.style.display = 'none';
                        lienzo.style.display = 'none';
                        imagenVista.style.display = 'block';
                        document.getElementById('paginaActual').textContent = 'Imagen';
                    };

                    barraProgreso.style.width = '100%';
                    setTimeout(() => barraProgreso.style.width = '0%', 1200);
                    return;
                }

                // Otro tipo
                alert('✅ Archivo cargado: ' + archivo.name + ' — Tipo soportado: PDF o Imagen');
                barraProgreso.style.width = '100%';
                setTimeout(() => barraProgreso.style.width = '0%', 1200);

            } catch (error) {
                console.error(error);
                alert('❌ Error: ' + error.message);
                barraProgreso.style.width = '0%';
            }
        }

        // Dibujar página PDF
        async function dibujarPagina() {
            const paginaPDF = await documentoPDF.getPage(pagina);
            const vista = paginaPDF.getViewport({ scale: escala });
            lienzo.width = vista.width;
            lienzo.height = vista.height;
            await paginaPDF.render({ canvasContext: ctx, viewport: vista }).promise;
            document.getElementById('paginaActual').textContent = `${pagina} / ${totalPaginas}`;
        }

        // Páginas
        function paginaAnterior() {
            if (pagina > 1) {
                pagina--;
                dibujarPagina();
            }
        }
        function paginaSiguiente() {
            if (pagina < totalPaginas) {
                pagina++;
                dibujarPagina();
            }
        }

        // Zoom
        function acercar() {
            escala += 0.2;
            if (documentoPDF) dibujarPagina();
            else aplicarZoomImagen();
        }
        function alejar() {
            if (escala > 0.4) escala -= 0.2;
            if (documentoPDF) dibujarPagina();
            else aplicarZoomImagen();
        }
        function aplicarZoomImagen() {
            imagenVista.style.transform = `scale(${escala})`;
            imagenVista.style.transformOrigin = 'top center';
        }

        // Descargar
        function descargar() {
            if (!archivoActual) return alert('⚠️ Primero carga un archivo');
            const enlace = document.createElement('a');
            enlace.href = urlArchivo || URL.createObjectURL(archivoActual);
            enlace.download = archivoActual.name;
            enlace.click();
        }

        // Limpiar
        function limpiar() {
            if (urlArchivo) URL.revokeObjectURL(urlArchivo);
            entrada.value = '';
            reiniciarVisor();
            document.getElementById('nombreArchivo').textContent = 'Sin archivo';
            document.getElementById('tipoArchivo').textContent = '—';
            document.getElementById('tamanoArchivo').textContent = '—';
            document.getElementById('paginaActual').textContent = '0 / 0';
        }

        function reiniciarVisor() {
            documentoPDF = null;
            pagina = 1;
            totalPaginas = 0;
            escala = 1.5;
            estadoVacio.style.display = 'block';
            lienzo.style.display = 'none';
            imagenVista.style.display = 'none';
            document.getElementById('btnAnterior').style.display = 'none';
            document.getElementById('btnSiguiente').style.display = 'none';
        }

        function formatoTamano(bytes) {
            if (bytes < 1024) return bytes + ' B';
            if (bytes < 1048576) return (bytes / 1024).toFixed(2) + ' KB';
            return (bytes / 1048576).toFixed(2) + ' MB';
        }
    </script>
</body>
</html>
