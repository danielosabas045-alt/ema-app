services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ema_database
      POSTGRES_USER: ema
      POSTGRES_PASSWORD: ema_local_password
    volumes:
      - ema_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U ema -d ema_database"]
      interval: 5s
      timeout: 5s
      retries: 20
  web:
    build: .
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      DATABASE_URL: postgresql://ema:ema_local_password@db:5432/ema_database
      BASE_URL: http://localhost:3000
      JWT_SECRET: local-change-this-secret
      ADMIN_EMAIL: danielosabas045@gmail.com
      ADMIN_PASSWORD: Admin123!ChangeMe
      ADMIN_NAME: Daniel Osabas
      GMAIL_USER: danielosabas045@gmail.com
      GMAIL_APP_PASSWORD: ""
    depends_on:
      db:
        condition: service_healthy
volumes:
  ema_pg:
