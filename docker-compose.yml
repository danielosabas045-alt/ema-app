services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ema_database
      POSTGRES_USER: ema
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Configurá_POSTGRES_PASSWORD}
    volumes:
      - ema_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U ema -d ema_database"]
      interval: 5s
      timeout: 5s
      retries: 20
  web:
    build: .
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      DATABASE_URL: postgresql://ema:${POSTGRES_PASSWORD}@db:5432/ema_database
      BASE_URL: http://localhost:3000
      JWT_SECRET: ${JWT_SECRET:?Configurá JWT_SECRET_seguro_de_32_caracteres}
      ADMIN_EMAIL: danielosabas045@gmail.com
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Configurá ADMIN_PASSWORD_seguro}
      ADMIN_NAME: Daniel Osabas
      GMAIL_USER: ${GMAIL_USER:-}
      GMAIL_APP_PASSWORD: ${GMAIL_APP_PASSWORD:-}
    depends_on:
      db:
        condition: service_healthy
volumes:
  ema_pg:
