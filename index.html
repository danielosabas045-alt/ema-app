<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EMA Mailer — Invitaciones desde danielosabas@gmail.com</title>
<style>
:root{color-scheme:dark;--bg:#07101f;--bg2:#0b1528;--panel:#0e1b31;--panel2:#12223d;--line:#203454;--text:#edf5ff;--muted:#8ea4c2;--cyan:#35d7ff;--violet:#8c7bff;--green:#35d39b;--amber:#ffc857;--red:#ff657a}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif;background:var(--bg);color:var(--text)}
body{background:radial-gradient(circle at 15% 0,rgba(53,215,255,.12),transparent 32%),radial-gradient(circle at 85% 15%,rgba(140,123,255,.12),transparent 28%),linear-gradient(180deg,#081120,#050a13)}
button,input,select,textarea{font:inherit}.app{min-height:100vh;display:grid;grid-template-columns:250px 1fr}
.sidebar{border-right:1px solid var(--line);background:rgba(6,13,25,.82);backdrop-filter:blur(18px);padding:22px 16px;position:sticky;top:0;height:100vh}
.brand{display:flex;gap:11px;align-items:center;padding:8px 10px 22px}.brandmark{width:42px;height:42px;border-radius:12px;background:linear-gradient(135deg,var(--cyan),var(--violet));display:grid;place-items:center;color:#05101c;font-weight:900}.brand h1{font-size:15px;margin:0}.brand small{color:var(--muted)}
.nav{display:grid;gap:7px}.nav button{background:transparent;border:1px solid transparent;color:var(--muted);padding:12px 13px;border-radius:11px;text-align:left;cursor:pointer}.nav button.active,.nav button:hover{background:var(--panel2);border-color:var(--line);color:var(--text)}
.role{margin-top:24px;padding:14px;border:1px solid var(--line);border-radius:14px;background:linear-gradient(135deg,rgba(53,215,255,.07),rgba(140,123,255,.07))}.role b{display:block;font-size:12px}.role span{display:inline-block;margin-top:8px;font-size:11px;color:var(--cyan);padding:5px 8px;border-radius:999px;background:rgba(53,215,255,.08)}
.main{min-width:0}.top{display:flex;justify-content:space-between;align-items:center;padding:22px 28px;border-bottom:1px solid var(--line);background:rgba(8,17,32,.65);backdrop-filter:blur(14px);position:sticky;top:0;z-index:5}.top h2{margin:0;font-size:20px}.top p{margin:4px 0 0;color:var(--muted);font-size:12px}.profile{display:flex;align-items:center;gap:10px}.avatar{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:#17304e;border:1px solid #2b4d73;font-weight:800}
.content{padding:26px;max-width:1400px;margin:auto}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.card{background:linear-gradient(180deg,rgba(14,27,49,.95),rgba(10,21,37,.95));border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:0 15px 40px rgba(0,0,0,.16)}.kpi small{color:var(--muted);font-size:11px}.kpi strong{display:block;font-size:28px;margin-top:8px}.trend{font-size:11px;margin-top:8px}.up{color:var(--green)}.warn{color:var(--amber)}
.section{margin-top:18px}.section-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.section-head h3{margin:0;font-size:15px}.btn{border:1px solid var(--line);background:var(--panel2);color:var(--text);padding:10px 14px;border-radius:10px;cursor:pointer}.btn.primary{border-color:transparent;background:linear-gradient(135deg,var(--cyan),var(--violet));color:#06101b;font-weight:800}.btn.danger{color:#fff;background:rgba(255,101,122,.09);border-color:rgba(255,101,122,.3)}
.table{width:100%;border-collapse:collapse}.table th,.table td{padding:12px 10px;border-bottom:1px solid rgba(32,52,84,.7);font-size:12px;text-align:left}.table th{color:var(--muted);font-weight:600}.badge{display:inline-flex;padding:5px 9px;border-radius:999px;font-size:10px;font-weight:800}.sent{background:rgba(53,211,155,.09);color:var(--green)}.draft{background:rgba(255,200,87,.1);color:var(--amber)}.running{background:rgba(53,215,255,.08);color:var(--cyan)}
.bar{height:10px;border-radius:999px;background:#0a1424;overflow:hidden}.fill{height:100%;background:linear-gradient(90deg,var(--cyan),var(--violet));border-radius:999px}.split{display:grid;grid-template-columns:1.35fr .95fr;gap:14px}.form{display:grid;gap:10px}.form label{font-size:11px;color:var(--muted)}.form input,.form textarea,.form select{width:100%;background:#091426;border:1px solid var(--line);color:var(--text);border-radius:10px;padding:11px 12px;outline:none}.form textarea{min-height:110px;resize:vertical}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.preview{border-radius:14px;border:1px solid var(--line);padding:16px;background:#081223}.mail{background:#f7fbff;color:#102036;border-radius:12px;padding:24px}.mail .logo2{font-weight:900;letter-spacing:.04em;color:#0a5f9d}.mail .hero{padding:34px 10px 18px;text-align:center}.mail h4{font-size:24px;margin:0 0 9px}.mail p{color:#566b84;line-height:1.6}.mail a{display:inline-block;margin-top:12px;padding:12px 20px;background:#0c78c9;color:#fff;text-decoration:none;border-radius:9px;font-weight:800}.mail small{display:block;margin-top:28px;color:#8090a3}
.hidden{display:none!important}.empty{padding:36px;text-align:center;color:var(--muted)}.notice{padding:11px 13px;background:rgba(53,215,255,.06);border:1px solid rgba(53,215,255,.17);border-radius:12px;color:#bfefff;font-size:12px}.stack{display:grid;gap:12px}.invite{min-height:100vh;display:grid;place-items:center;padding:28px}.invite-card{max-width:640px;width:100%;background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:20px}.invite-card .mail{padding:34px}.success{text-align:center;padding:30px}.success .circle{width:68px;height:68px;border-radius:50%;display:grid;place-items:center;margin:0 auto 15px;background:rgba(53,211,155,.1);border:1px solid rgba(53,211,155,.35);color:var(--green);font-size:28px}
@media(max-width:1000px){.app{grid-template-columns:1fr}.sidebar{display:none}.grid{grid-template-columns:repeat(2,1fr)}.split{grid-template-columns:1fr}}
.profile small{font-size:0}.profile small::after{content:"danielosabas@gmail.com";font-size:11px;color:var(--muted)}.invite-card::before{content:"ENVIADO DESDE  •  danielosabas@gmail.com";display:block;text-align:center;color:var(--cyan);font-size:10px;letter-spacing:.08em;margin-bottom:10px}.invite-card .mail::before{content:"CATÁLOGO  ·  💻 NOVA PRO 15  ·  📱 PIXEL X PRO  ·  🎧 PULSE BUDS";display:block;text-align:center;padding:10px 12px;border-radius:10px;background:linear-gradient(90deg,rgba(53,215,255,.1),rgba(140,123,255,.1));border:1px solid rgba(53,215,255,.18);color:#315d7b;font-size:10px;font-weight:800}@media(max-width:650px){.grid,.row{grid-template-columns:1fr}.top{padding:16px 18px}.content{padding:18px}}
</style>
</head>
<body>
<div id="app"><div class="card" style="max-width:760px;margin:60px auto;padding:40px;text-align:center"><div class="brandmark" style="margin:0 auto 15px">E</div><h1 style="font-size:28px;margin:0 0 8px">EMA MAILER</h1><p style="color:var(--muted);margin:0">Cargando plataforma de invitaciones...</p></div></div>
<script>
const state={page:'dashboard',role:'Administrador',sent:1248,opens:1038,clicks:741,campaigns:[{name:'Invitación evento septiembre',status:'Enviado',recipients:350,open:82,click:54},{name:'Presentación de plataforma',status:'Enviado',recipients:520,open:87,click:63},{name:'Nueva invitación',status:'Borrador',recipients:120,open:0,click:0}]};
const el=s=>document.querySelector(s);
function layout(inner){return `<div class="app"><aside class="sidebar"><div class="brand"><div class="brandmark">E</div><div><h1>EMA MAILER</h1><small>Invitation & Analytics</small></div></div><div class="nav">${[['dashboard','Panel'],['campaigns','Campañas'],['contacts','Contactos'],['analytics','Analítica'],['users','Usuarios']].map(([id,l])=>`<button class="${state.page===id?'active':''}" onclick="go('${id}')">${l}</button>`).join('')}</div><div class="role"><b>Sesión actual</b><span>${state.role}</span><p style="color:var(--muted);font-size:11px;line-height:1.5;margin:10px 0 0">Solo el Administrador puede ejecutar envíos. Moderador y Usuario tienen permisos limitados.</p></div></aside><main class="main"><header class="top"><div><h2>${title()}</h2><p>Control central de invitaciones, envíos y navegación.</p></div><div class="profile"><div style="text-align:right"><b style="font-size:12px">Administrador</b><small style="display:block;color:var(--muted)">admin@example.com</small></div><div class="avatar">AD</div></div></header><section class="content">${inner}</section></main></div>`}
function title(){return ({dashboard:'Panel principal',campaigns:'Campañas',contacts:'Contactos',analytics:'Analítica',users:'Usuarios'}[state.page]||'EMA Mailer')}
function dashboard(){return layout(`<div class="grid"><div class="card kpi"><small>Correos procesados</small><strong>${state.sent.toLocaleString()}</strong><div class="trend up">+12.4% esta semana</div></div><div class="card kpi"><small>Aperturas</small><strong>${state.opens.toLocaleString()}</strong><div class="trend up">${Math.round(state.opens/state.sent*100)}% tasa</div></div><div class="card kpi"><small>Clics</small><strong>${state.clicks.toLocaleString()}</strong><div class="trend up">${Math.round(state.clicks/state.sent*100)}% tasa</div></div><div class="card kpi"><small>Rebotes</small><strong>23</strong><div class="trend warn">1.8% del total</div></div></div><div class="split section"><div class="card"><div class="section-head"><h3>Actividad reciente</h3><button class="btn" onclick="go('campaigns')">Ver campañas</button></div><table class="table"><thead><tr><th>Campaña</th><th>Estado</th><th>Destinatarios</th><th>Open</th><th>Clic</th></tr></thead><tbody>${state.campaigns.map(c=>`<tr><td>${c.name}</td><td><span class="badge ${c.status==='Enviado'?'sent':'draft'}">${c.status}</span></td><td>${c.recipients}</td><td>${c.open}%</td><td>${c.click}%</td></tr>`).join('')}</tbody></table></div><div class="card"><div class="section-head"><h3>Rendimiento</h3><span class="badge running">LIVE</span></div><div class="stack"><div><div style="display:flex;justify-content:space-between;font-size:11px;margin-bottom:6px"><span>Aperturas</span><b>83%</b></div><div class="bar"><div class="fill" style="width:83%"></div></div></div><div><div style="display:flex;justify-content:space-between;font-size:11px;margin-bottom:6px"><span>Clics</span><b>59%</b></div><div class="bar"><div class="fill" style="width:59%"></div></div></div><div class="notice">Los enlaces de invitación registran clics antes de redirigir a la página de destino.</div></div></div></div>`)}
function campaigns(){return layout(`<div class="section-head"><div><h3>Campañas de correo</h3><p style="color:var(--muted);font-size:12px">Crea una campaña y genera enlaces únicos por destinatario.</p></div><button class="btn primary" onclick="go('new')">+ Nueva campaña</button></div><div class="card"><table class="table"><thead><tr><th>Nombre</th><th>Estado</th><th>Destinatarios</th><th>Apertura</th><th>Clics</th><th></th></tr></thead><tbody>${state.campaigns.map((c,i)=>`<tr><td><b>${c.name}</b></td><td><span class="badge ${c.status==='Enviado'?'sent':'draft'}">${c.status}</span></td><td>${c.recipients}</td><td>${c.open}%</td><td>${c.click}%</td><td><button class="btn" onclick="previewInvite(${i})">Previsualizar</button></td></tr>`).join('')}</tbody></table></div>`)}
function newCampaign(){return layout(`<div class="split"><div class="card"><div class="section-head"><h3>Nueva campaña</h3><span class="badge running">ADMIN</span></div><div class="form"><div class="row"><div><label>Nombre de campaña</label><input id="cname" value="Nueva invitación"></div><div><label>URL de destino</label><input id="target" value="https://ejemplo.com/invitacion"></div></div><div><label>Asunto</label><input id="subject" value="Tienes una nueva invitación"></div><div><label>Destinatarios autorizados</label><textarea id="recipients">usuario1@example.com\nusuario2@example.com\nusuario3@example.com</textarea></div><div class="notice">Se validan correos, se eliminan duplicados y se bloquean contactos sin consentimiento o dados de baja.</div><button class="btn primary" onclick="createCampaign()">Guardar campaña</button><button class="btn danger" onclick="simulateSend()">Enviar campaña de prueba</button></div></div><div class="card"><div class="section-head"><h3>Vista previa del correo</h3><span class="badge sent">RESPONSIVE</span></div><div class="preview"><div class="mail"><div class="logo2">EMA MAILER</div><div class="hero"><h4 id="pvsub">Tienes una nueva invitación</h4><p>Has recibido una invitación. Pulsa el botón para abrir la página asignada.</p><a href="#" onclick="event.preventDefault();openInvite()">ABRIR INVITACIÓN</a><small>Enlace único y seguimiento de clic.</small></div></div></div></div></div>`)}
function contacts(){return layout(`<div class="section-head"><div><h3>Contactos</h3><p style="color:var(--muted);font-size:12px">Solo se pueden enviar correos a contactos autorizados.</p></div><button class="btn">Importar CSV</button></div><div class="card"><table class="table"><thead><tr><th>Nombre</th><th>Correo</th><th>Consentimiento</th><th>Estado</th></tr></thead><tbody>${[['Daniel Osabas','daniel@example.com','2026-09-20','Activo'],['Ana López','ana@example.com','2026-09-18','Activo'],['Carlos Pérez','carlos@example.com','2026-09-15','Activo'],['Noelia Ruiz','noelia@example.com','—','Baja']].map(r=>`<tr><td>${r[0]}</td><td>${r[1]}</td><td>${r[2]}</td><td><span class="badge ${r[3]==='Activo'?'sent':'draft'}">${r[3]}</span></td></tr>`).join('')}</tbody></table></div>`)}
function analytics(){return layout(`<div class="grid"><div class="card kpi"><small>Tasa de apertura</small><strong>83.2%</strong></div><div class="card kpi"><small>Tasa de clic</small><strong>59.4%</strong></div><div class="card kpi"><small>Rebote</small><strong>1.8%</strong></div><div class="card kpi"><small>Destinos abiertos</small><strong>741</strong></div></div><div class="card section"><h3 style="margin-top:0">Conversión de invitaciones</h3><div style="margin-top:22px" class="stack"><div><div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:6px"><span>Entregados</span><b>100%</b></div><div class="bar"><div class="fill" style="width:100%"></div></div></div><div><div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:6px"><span>Abiertos</span><b>83%</b></div><div class="bar"><div class="fill" style="width:83%"></div></div></div><div><div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:6px"><span>Clic en invitación</span><b>59%</b></div><div class="bar"><div class="fill" style="width:59%"></div></div></div></div></div>`)}
function users(){return layout(`<div class="section-head"><div><h3>Usuarios y permisos</h3><p style="color:var(--muted);font-size:12px">Tres accesos separados.</p></div></div><div class="grid"><div class="card"><span class="badge running">ADMINISTRADOR</span><h3>Control total</h3><p style="color:var(--muted);font-size:12px;line-height:1.6">Gestiona usuarios, contactos, campañas y envíos.</p></div><div class="card"><span class="badge draft">MODERADOR</span><h3>Gestión</h3><p style="color:var(--muted);font-size:12px;line-height:1.6">Gestiona contactos y consulta campañas. No puede enviar.</p></div><div class="card"><span class="badge sent">USUARIO</span><h3>Consulta</h3><p style="color:var(--muted);font-size:12px;line-height:1.6">Accede únicamente a la información que corresponda a su cuenta.</p></div></div>`)}
function app(){if(state.page==='new')return newCampaign(); if(state.page==='campaigns')return campaigns(); if(state.page==='contacts')return contacts(); if(state.page==='analytics')return analytics(); if(state.page==='users')return users(); return dashboard()}
function go(p){state.page=p;document.getElementById('app').innerHTML=app()}
function createCampaign(){state.campaigns.unshift({name:el('#cname').value||'Nueva campaña',status:'Borrador',recipients:(el('#recipients').value.match(/[^\s]+@[^\s]+/g)||[]).length,open:0,click:0});alert('Campaña guardada. En producción, el Gateway la enviaría al núcleo SMTP.');go('campaigns')}
function simulateSend(){alert('Prueba preparada: validación → limpieza → SMTP concurrente → progreso en tiempo real. El envío real requiere SMTP de producción.');}
function previewInvite(){openInvite()}
function openInvite(){document.body.innerHTML='<div class="invite"><div class="invite-card"><div class="mail"><div class="logo2">EMA MAILER</div><div class="hero"><h4>Invitación confirmada</h4><p>Esta es la página de destino de una invitación única. El clic ya quedó registrado y el destinatario continúa a su experiencia.</p><a href="#" onclick="event.preventDefault();document.body.innerHTML=\'<div class=success><div class=circle>✓</div><h2>Invitación abierta</h2><p style=\'color:#8ea4c2\'>La navegación funcionó correctamente.</p></div>\'">CONTINUAR</a></div></div></div></div>'}
go('dashboard');
</script>
</body>
</html>
