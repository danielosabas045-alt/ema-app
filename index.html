<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>EMA Mailer | Invitaciones</title>
<style>
:root{--bg:#060b14;--panel:#0d1626;--panel2:#111e33;--line:#243753;--text:#edf7ff;--muted:#8ba1bd;--cyan:#32d9ff;--violet:#8b7cff;--green:#33d59b;--red:#ff667b}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 15% 0,#0a2840 0,transparent 32%),radial-gradient(circle at 90% 10%,#24164b 0,transparent 30%),var(--bg);color:var(--text);font:14px Inter,system-ui,sans-serif}button,input,textarea{font:inherit}
.app{min-height:100vh;display:grid;grid-template-columns:245px 1fr}.side{padding:20px 16px;border-right:1px solid var(--line);background:#07101ce8}.brand{display:flex;gap:11px;align-items:center;padding:8px}.mark{width:42px;height:42px;border-radius:12px;background:linear-gradient(135deg,var(--cyan),var(--violet));color:#03101a;display:grid;place-items:center;font-weight:900}.brand b{display:block}.brand small{color:var(--muted)}.nav{margin-top:25px;display:grid;gap:7px}.nav button{padding:12px;border-radius:10px;border:1px solid transparent;background:transparent;color:var(--muted);text-align:left;cursor:pointer}.nav button.active,.nav button:hover{background:var(--panel2);border-color:var(--line);color:var(--text)}.me{margin-top:25px;padding:14px;border:1px solid var(--line);border-radius:13px;background:#0b1525}.me small{display:block;color:var(--muted);margin-top:7px}.badge{display:inline-block;padding:5px 9px;border-radius:999px;font-size:10px;font-weight:800}.admin{color:var(--cyan);background:#32d9ff14}.sent{color:var(--green);background:#33d59b12}.draft{color:#ffc857;background:#ffc85712}
.main{min-width:0}.top{padding:20px 27px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;background:#07111ee8;position:sticky;top:0;z-index:2}.top h1{font-size:20px;margin:0}.top p{margin:4px 0 0;color:var(--muted);font-size:12px}.account{text-align:right;font-size:12px}.account small{display:block;color:var(--muted)}.body{padding:25px;max-width:1400px;margin:auto}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.card{padding:18px;border:1px solid var(--line);border-radius:16px;background:linear-gradient(180deg,#0e1a2c,#0a1424);box-shadow:0 15px 50px #0003}.kpi small{color:var(--muted)}.kpi strong{display:block;font-size:28px;margin:7px 0}.up{color:var(--green);font-size:11px}.section{margin-top:16px}.split{display:grid;grid-template-columns:1.25fr .85fr;gap:14px}.head{display:flex;justify-content:space-between;align-items:center;margin-bottom:13px}.head h2{font-size:15px;margin:0}.btn{border:1px solid var(--line);background:var(--panel2);color:var(--text);padding:10px 14px;border-radius:9px;cursor:pointer}.btn.primary{border:0;background:linear-gradient(135deg,var(--cyan),var(--violet));color:#06101a;font-weight:800}.btn.red{color:#fff;border-color:#ff667b55;background:#ff667b10}.table{width:100%;border-collapse:collapse}.table th,.table td{text-align:left;padding:11px 9px;border-bottom:1px solid #22334e;font-size:12px}.table th{color:var(--muted)}.bar{height:9px;background:#07111e;border-radius:9px;overflow:hidden}.fill{height:100%;background:linear-gradient(90deg,var(--cyan),var(--violet))}
.form{display:grid;gap:12px}.form label{display:block;color:var(--muted);font-size:11px;margin-bottom:5px}.form input,.form textarea{width:100%;padding:11px;border:1px solid var(--line);border-radius:9px;background:#081321;color:var(--text);outline:none}.form textarea{min-height:125px}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.preview{background:#07111f;border:1px solid var(--line);padding:14px;border-radius:14px}.email{background:#f6fbff;color:#142339;border-radius:12px;padding:24px}.email .brandmail{font-weight:900;color:#0876ba}.email h2{font-size:24px}.email p{color:#5c7089;line-height:1.6}.email .cta{display:inline-block;padding:12px 19px;background:#0876ba;border-radius:9px;color:#fff;text-decoration:none;font-weight:800;margin-top:8px}.products{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:18px 0}.product{border:1px solid #d8e5ef;background:#fff;border-radius:10px;padding:12px;text-align:center}.icon{font-size:42px}.product b{display:block;margin-top:7px}.price{color:#0876ba;font-weight:900;margin-top:4px}.invite{min-height:100vh;display:grid;place-items:center;padding:25px}.invite .email{max-width:720px;width:100%;padding:34px;box-shadow:0 25px 70px #0008}
@media(max-width:950px){.app{grid-template-columns:1fr}.side{display:none}.grid{grid-template-columns:repeat(2,1fr)}.split{grid-template-columns:1fr}}@media(max-width:620px){.grid,.row,.products{grid-template-columns:1fr}.top{padding:16px}.body{padding:16px}}
</style>
</head>
<body><div id="root"></div>
<script>
const S={page:'dashboard',role:'Administrador',sender:'danielosabas@gmail.com',campaigns:[['Presentación de productos','Enviado','520','87%','63%'],['Invitación septiembre','Enviado','350','82%','54%'],['Nueva invitación','Borrador','120','—','—']]};
const $=s=>document.querySelector(s);
const products=[['💻','Nova Pro 15','Q 8,499'],['📱','Pixel X Pro','Q 4,299'],['🎧','Pulse Buds','Q 899']];
function shell(content){return '<div class="app"><aside class="side"><div class="brand"><div class="mark">E</div><div><b>EMA MAILER</b><small>Invitation & Analytics</small></div></div><nav class="nav">'+[['dashboard','Panel'],['campaigns','Campañas'],['contacts','Contactos'],['analytics','Analítica'],['users','Usuarios']].map(x=>'<button class="'+(S.page==x[0]?'active':'')+'" onclick="go(\''+x[0]+'\')">'+x[1]+'</button>').join('')+'</nav><div class="me"><span class="badge admin">ADMINISTRADOR</span><small>'+S.sender+'</small><small>Único rol con permiso de envío.</small></div></aside><main class="main"><header class="top"><div><h1>'+title()+'</h1><p>Gestioná invitaciones, destinatarios y navegación.</p></div><div class="account"><b>'+S.sender+'</b><small>Sesión: Administrador</small></div></header><div class="body">'+content+'</div></main></div>'}
function title(){return ({dashboard:'Panel principal',campaigns:'Campañas',contacts:'Contactos',analytics:'Analítica',users:'Usuarios',new:'Nueva campaña'}[S.page]||'EMA Mailer')}
function dashboard(){return shell('<div class="grid"><div class="card kpi"><small>Correos procesados</small><strong>1,248</strong><span class="up">+12.4% esta semana</span></div><div class="card kpi"><small>Aperturas</small><strong>1,038</strong><span class="up">83.2% de tasa</span></div><div class="card kpi"><small>Clics</small><strong>741</strong><span class="up">59.4% de tasa</span></div><div class="card kpi"><small>Rebotes</small><strong>23</strong><span style="color:#ffc857;font-size:11px">1.8% del total</span></div></div><div class="split section"><div class="card"><div class="head"><h2>Campañas recientes</h2><button class="btn" onclick="go(\'campaigns\')">Ver todas</button></div><table class="table"><tr><th>Campaña</th><th>Estado</th><th>Dest.</th><th>Open</th><th>Clic</th></tr>'+S.campaigns.map(c=>'<tr><td><b>'+c[0]+'</b></td><td><span class="badge '+(c[1]=='Enviado'?'sent':'draft')+'">'+c[1]+'</span></td><td>'+c[2]+'</td><td>'+c[3]+'</td><td>'+c[4]+'</td></tr>').join('')+'</table></div><div class="card"><div class="head"><h2>Rendimiento</h2><span class="badge admin">LIVE</span></div><p style="font-size:11px;color:var(--muted)">Aperturas</p><div class="bar"><div class="fill" style="width:83%"></div></div><p style="font-size:11px;color:var(--muted)">Clics</p><div class="bar"><div class="fill" style="width:59%"></div></div><p class="section" style="color:#a9dcff;font-size:11px">La invitación dirige al destinatario a una página de productos.</p></div></div><div class="card section"><div class="head"><h2>Tu remitente</h2><span class="badge sent">CONFIGURADO</span></div><p style="margin:0;color:var(--muted)">Los mensajes de producción deben salir autenticados como <b style="color:var(--text)">'+S.sender+'</b>.</p></div>')}
function campaigns(){return shell('<div class="head"><div><h2>Campañas</h2><p style="color:var(--muted);font-size:12px">Cada destinatario recibe un enlace individual.</p></div><button class="btn primary" onclick="go(\'new\')">+ Nueva campaña</button></div><div class="card"><table class="table"><tr><th>Nombre</th><th>Estado</th><th>Dest.</th><th>Open</th><th>Clic</th><th></th></tr>'+S.campaigns.map((c,i)=>'<tr><td>'+c[0]+'</td><td><span class="badge '+(c[1]=='Enviado'?'sent':'draft')+'">'+c[1]+'</span></td><td>'+c[2]+'</td><td>'+c[3]+'</td><td>'+c[4]+'</td><td><button class="btn" onclick="invite()">Abrir invitación</button></td></tr>').join('')+'</table></div>')}
function newPage(){return shell('<div class="split"><div class="card"><div class="head"><h2>Nueva invitación</h2><span class="badge admin">ADMIN</span></div><div class="form"><div class="row"><div><label>Nombre</label><input id="name" value="Invitación de productos"></div><div><label>URL de destino</label><input id="url" value="https://tuempresa.com/catalogo"></div></div><div><label>Asunto</label><input value="Tu invitación ya está lista"></div><div><label>Correos destinatarios</label><textarea id="emails">cliente1@example.com
cliente2@example.com
cliente3@example.com</textarea></div><button class="btn primary" onclick="send()">Enviar invitación</button><button class="btn red" onclick="alert('El envío real usa SMTP autenticado. Configurá las credenciales de producción del remitente '+S.sender+'.')">Configurar envío real</button><div class="card" style="padding:12px;background:#091526"><b style="font-size:12px">Remitente</b><div style="color:var(--cyan);margin-top:5px">'+S.sender+'</div></div></div></div><div class="card"><div class="head"><h2>Vista previa</h2><span class="badge sent">RESPONSIVE</span></div><div class="preview">'+emailHtml()+'</div></div></div>')}
function contacts(){return shell('<div class="head"><div><h2>Contactos</h2><p style="color:var(--muted);font-size:12px">Contactos autorizados para recibir invitaciones.</p></div><button class="btn">Importar CSV</button></div><div class="card"><table class="table"><tr><th>Nombre</th><th>Correo</th><th>Consentimiento</th><th>Estado</th></tr>'+[['Ana López','ana@example.com','2026-09-18','Activo'],['Carlos Pérez','carlos@example.com','2026-09-15','Activo'],['Noelia Ruiz','noelia@example.com','—','Baja']].map(r=>'<tr><td>'+r[0]+'</td><td>'+r[1]+'</td><td>'+r[2]+'</td><td><span class="badge '+(r[3]=='Activo'?'sent':'draft')+'">'+r[3]+'</span></td></tr>').join('')+'</table></div>')}
function analytics(){return shell('<div class="grid"><div class="card kpi"><small>Tasa de apertura</small><strong>83.2%</strong></div><div class="card kpi"><small>Tasa de clic</small><strong>59.4%</strong></div><div class="card kpi"><small>Rebote</small><strong>1.8%</strong></div><div class="card kpi"><small>Invitaciones abiertas</small><strong>741</strong></div></div><div class="card section"><div class="head"><h2>Embudo de invitación</h2></div><p style="color:var(--muted);font-size:11px">Entregados</p><div class="bar"><div class="fill" style="width:100%"></div></div><p style="color:var(--muted);font-size:11px">Abiertos</p><div class="bar"><div class="fill" style="width:83%"></div></div><p style="color:var(--muted);font-size:11px">Clics</p><div class="bar"><div class="fill" style="width:59%"></div></div></div>')}
function users(){return shell('<div class="head"><h2>Usuarios y permisos</h2></div><div class="grid"><div class="card"><span class="badge admin">ADMINISTRADOR</span><h3>Control total</h3><p style="color:var(--muted);line-height:1.6">Puede crear campañas y realizar envíos.</p></div><div class="card"><span class="badge draft">MODERADOR</span><h3>Gestión</h3><p style="color:var(--muted);line-height:1.6">Puede gestionar contactos y consultar campañas.</p></div><div class="card"><span class="badge sent">USUARIO</span><h3>Consulta</h3><p style="color:var(--muted);line-height:1.6">Ve solamente la información permitida para su cuenta.</p></div></div>')}
function emailHtml(){return '<div class="email"><div class="brandmail">EMA MAILER</div><p style="font-size:11px;color:#789">De: '+S.sender+'</p><h2>Descubrí nuestra selección</h2><p>Te enviamos una invitación personalizada. Conocé nuestros productos y abrí tu página desde el botón.</p><div class="products">'+products.map(p=>'<div class="product"><div class="icon">'+p[0]+'</div><b>'+p[1]+'</b><div class="price">'+p[2]+'</div></div>').join('')+'</div><div style="text-align:center"><a class="cta" href="#" onclick="event.preventDefault();invite()">ABRIR MI INVITACIÓN</a></div><small style="display:block;text-align:center;color:#8b9aaa;margin-top:22px">Enlace personalizado · EMA Mailer</small></div>'}
function invite(){document.body.innerHTML='<div class="invite">'+emailHtml().replace('<div class="email">','<div class="email" style="max-width:760px">').replace('href="#"','href="#"')+'</div></div>'}
function send(){const raw=$('#emails').value.split(/\s+/).filter(Boolean),valid=raw.filter(x=>/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(x));if(!valid.length)return alert('Ingresá al menos un correo válido.');alert('Campaña preparada para '+valid.length+' destinatario(s). Para envío real debe estar conectado el SMTP autenticado de '+S.sender+'.')}
function go(p){S.page=p;$('#root').innerHTML=p==='new'?newPage():p==='campaigns'?campaigns():p==='contacts'?contacts():p==='analytics'?analytics():p==='users'?users():dashboard()}
go('dashboard');
</script></body></html>
