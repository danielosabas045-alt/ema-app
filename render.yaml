# El plan basic-256mb de PostgreSQL tiene coste. Revisar el precio en Render antes de crear.
# El servidor usa la URL del propio servicio para enlaces seguros. DATABASE_URL usa la red privada.
services:
  - type: web
    name: ema-database
    runtime: node
    plan: free
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "24"
      - key: TRUST_PROXY
        value: "1"
      - key: DATABASE_URL
        fromDatabase:
          name: ema-database-postgres
          property: connectionString
      - key: DATABASE_SSL
        value: disable
      - key: ADMIN_EMAIL
        value: danielosabas045@gmail.com
      - key: ADMIN_NAME
        value: Daniel Osabas
      - key: ADMIN_PASSWORD
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: MAIL_FROM
        sync: false

databases:
  - name: ema-database-postgres
    plan: basic-256mb
    databaseName: ema_database
    user: ema
    ipAllowList: []
