# PostgreSQL persistente tiene coste de cómputo y almacenamiento. Revisar el plan antes de aprobar.
# El servidor usa la URL del propio servicio para enlaces seguros. DATABASE_URL usa la red privada.
services:
  - type: web
    name: ema-database
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "24"
      - key: TRUST_PROXY
        value: "1"
      - key: DATABASE_URL
        fromDatabase:
          name: ema-database-postgres
          property: connectionString
      - key: DATABASE_SSL
        value: disable
      - key: ADMIN_EMAIL
        value: danielosabas045@gmail.com
      - key: ADMIN_NAME
        value: Daniel Osabas
      - key: ADMIN_PASSWORD
        generateValue: true
    # Configurar RESEND_API_KEY y MAIL_FROM después en Environment para activar correo.
    # La ausencia de correo no bloquea el acceso al servidor ni los registros SQL.

databases:
  - name: ema-database-postgres
    plan: 0.1c-256mb
    region: oregon
    diskSizeGB: 1
    databaseName: ema_database
    user: ema
    ipAllowList: []
