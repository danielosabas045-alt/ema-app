name: EMA V65 Android APK
on:
  push:
    branches: [build-ema-v65-android]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK 35
        run: |
          SDKM=$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools" -type f -name sdkmanager | sort -V | tail -1)
          echo "Using ${SDKM}"
          yes | "${SDKM}" --licenses >/dev/null || true
          "${SDKM}" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build debug APK
        run: gradle -p android-v65 assembleDebug --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: EMA-V65-Android-APK
          path: android-v65/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
          if-no-files-found: error
