# Prueba gratuita: PostgreSQL caduca a los 30 días; no usar como almacenamiento permanente.
# El servidor Free se suspende tras 15 minutos sin tráfico y tarda en despertar.
# El servidor usa la URL del propio servicio para enlaces seguros. DATABASE_URL usa la red privada.
services:
  - type: web
    name: ema-database
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "24"
      - key: TRUST_PROXY
        value: "1"
      - key: DATABASE_URL
        fromDatabase:
          name: ema-database-postgres
          property: connectionString
      - key: DATABASE_SSL
        value: disable
      - key: ADMIN_EMAIL
        value: danielosabas045@gmail.com
      - key: ADMIN_NAME
        value: Daniel Osabas
      - key: ADMIN_PASSWORD
        generateValue: true
    # Configurar BREVO_API_KEY + BREVO_SENDER_EMAIL o RESEND_API_KEY + MAIL_FROM en Environment.
    # La ausencia de correo no bloquea el acceso al servidor ni los registros SQL.

databases:
  - name: ema-database-postgres
    plan: free
    region: oregon
    databaseName: ema_database
    user: ema
    ipAllowList: []
